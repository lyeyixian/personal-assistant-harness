[project]
name = "personal-assistant-harness"
version = "0.1.0"
description = "Personal AI assistant harness — pa CLI, core facade, and modules."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic-settings>=2.7",
    "pydantic-ai==2.18.0",
    "tomli-w>=1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    # Pinned exactly: the wheel bundles the fonts the resume template renders
    # with, so a version bump would change the rendered bytes.
    "typst==0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0",
]

[project.scripts]
pa = "assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["experiments"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
